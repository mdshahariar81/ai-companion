[package]
name = "prozyn-ai"
version = "0.1.0"
description = "PROZYN — Personal Intelligence System"
authors = ["Md Shahariar Hossen"]
edition = "2021"

[lib]
name = "prozyn_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
